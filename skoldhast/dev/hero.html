<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sköldhästen – hero dev</title>
<style>
    html, body { margin: 0; height: 100%; background: #fbf8f1; font: 13px/1.3 system-ui, sans-serif; color: #3b3530; overflow: hidden; }
    #bar { position: fixed; left: 0; right: 0; top: 0; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; z-index: 2; background: rgba(251, 248, 241, 0.85); }
    #bar button { font: inherit; padding: 3px 8px; border: 1px solid #b8ada0; border-radius: 12px; background: #fff; color: #3b3530; cursor: pointer; }
    #bar button.on { background: #e0782a; border-color: #9c4318; color: #fff; }
    #bar .sep { width: 10px; }
    #info { position: fixed; left: 8px; bottom: 6px; z-index: 2; color: #6b635a; }
    #stage { position: fixed; inset: 0; }
    #strip { position: fixed; inset: 0; z-index: 5; background: #fbf8f1; display: none; }
    body.review #bar, body.review #info { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"></div>
<div id="info"></div>
<canvas id="strip"></canvas>
<script type="module" src="./hero-dev.mjs"></script>
</body>
</html>
